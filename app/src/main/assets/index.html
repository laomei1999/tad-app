<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAD 骨科精密测量系统 v4</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #000; color: white; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* 顶部标题栏 */
        .top-nav {
            background: #111;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 101;
        }
        .top-title { font-size: 16px; font-weight: bold; color: #007bff; }
        
        .header { background: #222; padding: 10px; z-index: 100; border-bottom: 1px solid #444; }
        .config-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
        .btn-group { display: flex; gap: 8px; align-items: center; }
        .btn { border: none; padding: 6px 14px; border-radius: 6px; font-size: 14px; color: white; cursor: pointer; background: #444; }
        
        /* 下拉菜单样式 */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background-color: #333;
            min-width: 140px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5);
            z-index: 200;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #555;
            max-height: 300px;
            overflow-y: auto;
        }
        .dropdown-content a {
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            display: block;
            font-size: 13px;
        }
        .dropdown-content a:hover { background-color: #007bff; }
        .dropdown:hover .dropdown-content { display: block; }

        /* 模态弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #222;
            color: #eee;
            padding: 20px;
            border-radius: 10px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #444;
            line-height: 1.6;
            font-size: 14px;
        }
        .modal-header { font-size: 18px; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid #444; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .close-btn { font-size: 20px; cursor: pointer; color: #aaa; border: none; background: none; }
        .close-btn:hover { color: #fff; }
        .modal-body img { max-width: 100%; height: auto; margin: 10px 0; border-radius: 6px; border: 1px solid #555; }
        
        /* 表格样式 */
        .guide-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        .guide-table th, .guide-table td { border: 1px solid #555; padding: 6px; text-align: left; }
        .guide-table th { background: #333; }

        /* TAD 结果栏 */
        .result-bar { background: #111; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .tad-val { font-size: 28px; font-weight: bold; transition: color 0.3s; }
        .legend-box { font-size: 11px; color: #ddd; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .dot { width: 8px; height: 8px; border-radius: 2px; }

        /* 风险提示区 */
        #riskNotice { font-size: 13px; font-weight: bold; text-align: center; padding: 4px; border-radius: 4px; margin-bottom: 8px; display: none; }
        .risk-red { color: #ff4444; background: rgba(255, 68, 68, 0.1); }

        /* 标签切换栏 */
        .tab-bar { display: flex; gap: 4px; background: #444; padding: 3px; border-radius: 8px; }
        .tab { flex: 1; padding: 8px; text-align: center; background: #333; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 13px; }
        .tab.active { background: #007bff; color: white; }
        .tab-val-inline { margin-left: 4px; font-size: 12px; }
        
        /* 核心视图布局 */
        .viewport-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            overflow: hidden;
            background: #111;
        }

        .main-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            touch-action: none;
        }

        .viewer-box {
            display: none;
            position: relative;
            transform-origin: top center;
            margin: 0 auto;
        }
        .viewer-box.active { display: block; }
        .zoom-layer { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
        img { display: block; user-select: none; pointer-events: none; }
        svg { touch-action: none; user-select: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; }
        
        /* 测量线样式 */
        .line-ref { stroke: #ffff00; stroke-width: 2.5; }
        .line-mea { stroke: #ff00ff; stroke-width: 2.5; }
        .handle-hitbox { fill: transparent; cursor: pointer; }

        /* 放大镜 */
        #magnifier {
            position: fixed; width: 80px; height: 80px; border: 2px solid #007bff;
            border-radius: 50%; overflow: hidden; display: none; z-index: 1000;
            pointer-events: none; background: #000; box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }
        #mag-content { position: absolute; transform-origin: 0 0; }
        #magnifier::after { content: ""; position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 1px solid #ff0000; transform: translate(-50%, -50%); border-radius: 50%; }

        input[type="file"] { display: none; }
        .ref-box { margin-top: 15px; padding: 10px; background: #1a1a1a; border-left: 3px solid #007bff; border-radius: 4px; font-size: 11px; word-break: break-word; color: #bbb; }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<div class="top-nav">
    <div class="top-title" id="t-topTitle">TAD在线测量</div>
    <div class="dropdown">
        <button class="btn" style="background:#007bff; padding: 4px 10px; font-size: 13px;">🌐 Language ▼</button>
        <div class="dropdown-content">

            <a href="javascript:void(0)" onclick="changeLang('en')">English (英语)</a>

            <a href="javascript:void(0)" onclick="changeLang('pt')">Português (葡萄牙语)</a>

            <a href="javascript:void(0)" onclick="changeLang('zh-TW')">繁體中文</a>
        </div>
    </div>
</div>

<div class="header">
    <div class="config-row">
        <div style="font-size:14px;"><span id="t-scaleLabel">标尺:</span> <input type="number" id="refD" value="16.0" step="0.1" oninput="updateCalc()" style="width:55px; background:#444; color:white; border:none; padding:8px; border-radius:4px; text-align:center; font-weight:bold;"> mm</div>
        <div class="btn-group">
            <button class="btn" style="background:#28a745;" onclick="triggerFile(event)" id="t-btnSelectImg">📂 选择图片</button>
            <div class="dropdown">
                <button class="btn" style="background:#17a2b8;" id="t-btnUsage">使用方法 ▼</button>
                <div class="dropdown-content">
                    <a href="javascript:void(0)" onclick="openModal('usageModal')" id="t-menuUsage">用法</a>
                    <a href="javascript:void(0)" onclick="openModal('aboutModal')" id="t-menuAbout">关于</a>
                </div>
            </div>
        </div>
    </div>
    
    <div class="result-bar">
        <div><span style="font-size:11px;color:#aaa;" id="t-totalTadLabel">总 TAD</span><br><span class="tad-val" id="tadTotal">--</span></div>
        <div class="legend-box">
            <div class="legend-item"><div class="dot" style="background:#ffff00;"></div><span id="t-legendRef">标尺(校准) </span></div>
            <div class="legend-item"><div class="dot" style="background:#ff00ff;"></div><span id="t-legendMea">测量(数据) </span></div>
        </div>
    </div>

    <div class="tab-bar">
        <div id="tab-ap" class="tab active" onclick="switchTab('ap')"><span id="t-tabAp">正位</span><span class="tab-val-inline" id="apDisplay">--</span></div>
        <div id="tab-lat" class="tab" onclick="switchTab('lat')"><span id="t-tabLat">侧位</span><span class="tab-val-inline" id="latDisplay">--</span></div>
    </div>

    <div id="riskNotice" class="risk-red"></div>
</div>

<div class="viewport-wrapper">
    <div class="main-container" id="container">
        <div id="magnifier">
            <div id="mag-content"></div>
        </div>
        <div id="view-ap" class="viewer-box active">
            <div class="zoom-layer" id="layer-ap"><img id="img-ap"><svg id="svg-ap"></svg></div>
        </div>
        <div id="view-lat" class="viewer-box">
            <div class="zoom-layer" id="layer-lat"><img id="img-lat"><svg id="svg-lat"></svg></div>
        </div>
    </div>
</div>

<input type="file" id="inputAlbum" accept="image/*" onchange="loadImg(this)">

<!-- 用法 弹窗 -->
<div id="usageModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span id="t-modalUsageTitle">使用方法及参考意义</span>
            <button class="close-btn" onclick="closeModal('usageModal')">&times;</button>
        </div>
        <div class="modal-body" id="t-modalUsageBody"></div>
    </div>
</div>

<!-- 关于 弹窗 -->
<div id="aboutModal" class="modal">

        <div class="modal-header">
            <span id="t-modalAboutTitle">关于系统</span>
            <button class="close-btn" onclick="closeModal('aboutModal')">&times;</button>
        </div>
        <div class="modal-body" id="t-modalAboutBody"></div>
    </div>
</div>

<script>
    // 文献引用通用组件 HTML
    const refHtml = `
        <div class="ref-box">
            <strong>Literature Reference:</strong><br>
            Levine AR, Klug T, Cross J, Salameh M, Riedel M, Leslie M. Risk factors for cut-throughs in intertrochanteric hip fracture fixation Tip-Apex Distance (TAD) <10 mm and Apex-to-Center <4 mm. <em>Injury</em>. 2025 Mar;56(3):112205. doi: 10.1016/j.injury.2025.112205. Epub 2025 Feb 7. PMID: 39954635.
        </div>

    // 全量多语言字典

            usageContent: `

                • <strong>Skala kalibrieren:</strong> Ziehen Sie die gelben Linienpunkte präzise auf die Struktur mit bekanntem Durchmesser.<br>
                • <strong>Tip-Apex-Distanz messen:</strong> Ziehen Sie die rosa Linienpunkte: ein Ende an die Schraubenspitze, das andere an den Schnittpunkt von Schenkelhalsachse und Hüftkopfoberfläche.<br>

                    <tr><th>Metrik</th><th>Ergebnis</th><th>Status</th><th>Klinischer Hinweis</th></tr>

            ` + refHtml,
            aboutContent: `
                <p><strong>TAD Präzisions-Messsystem</strong> ist ein leichtes webbasiertes Werkzeug für Osteosynthesen bei pertrochantären und Schenkelhalsfrakturen (PFNA, DHS, Gamma-Nagel, FNS usw.).</p>

                <hr style="border:0; border-top:1px solid #444; margin:15px 0;">
                <p><strong>Autor:</strong> Yunmei Li</p>
                <p><strong>Adresse:</strong> Abt. für Hüfttraumatologie, Cangzhou Hospital of Integrative Medicine, Hebei, China</p>
                <p><strong>E-MAIL:</strong> laomei1999@hotmail.com</p>

        'en': {

            riskCutOut: "⚠️ Warning: Risk of screw cut-out (TAD > 25mm)", riskCutThrough: "❌ Risk: Risk of joint penetration (Total TAD < 10mm)", riskApPenetration: "❌ Risk: AP screw penetration risk (Distance ≤ 4mm)", riskLatPenetration: "❌ Risk: Lateral screw penetration risk (Distance ≤ 4mm)", visitCountLabel: "Visit Count: ",
            usageContent: `

                <p><strong>Address:</strong> Dept. of Hip Trauma, Cangzhou Hospital of Integrative Medicine, Hebei, China</p>
                <p><strong>EMAIL:</strong> laomei1999@hotmail.com</p>
            `

        document.getElementById('t-modalAboutBody').innerHTML = dict.aboutContent + `
            <div style="margin-top:15px; padding-top:10px; border-top:1px dashed #444; text-align:center;">
                <span style="font-size:12px; color:#888;">${dict.visitCountLabel}</span>
                <img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Ftad-ortho-measurement.pages.dev&count_bg=%23007BFF&title_bg=%23555555&icon=&icon_color=%23E7E7E7&title=hits&edge_flat=false" alt="Visits Counter" style="vertical-align:middle; display:inline-block; border:none; margin:0;">
            </div>
        `;

        updateCalc();
    }

    let cur = 'ap';
    let data = { 
        ap: { s: 1, baseS: 1, dist: 0, moved1: false, moved2: false, naturalW: 0, naturalH: 0, panX:0, panY:0 }, 
        lat: { s: 1, baseS: 1, dist: 0, moved1: false, moved2: false, naturalW: 0, naturalH: 0, panX:0, panY:0 } 
    };
    
    let evCache = [];
    let prevDiff = -1;
    let isEndpointDragging = false;
    let panState = { dragging: false, lastX: 0, lastY: 0 };
    let panFrame = null;
    
    const mag = document.getElementById('magnifier');
    const magContent = document.getElementById('mag-content');
    let magSvg = null;
    let magLine = null;

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = 'none';
        }
    };

    function createHandle(svg, lineId, idx, x, y, color) {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("id", `${lineId}-g${idx}`);
        g.setAttribute("transform", `translate(${x},${y}) rotate(0)`);

        const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        let points = (idx === 1) ? "0,0 -25,-15 -25,15" : "0,0 25,-15 25,15";
        poly.setAttribute("points", points);
        poly.style.fill = color + "66"; 
        poly.style.stroke = color;
        poly.style.strokeWidth = "1.5px";
        poly.setAttribute("class", "handle-shape");
        
        const hit = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        hit.setAttribute("r", "40");
        hit.setAttribute("class", "handle-hitbox");
        hit.onpointerdown = (e) => startHDrag(e, lineId, idx, g);

        g.appendChild(poly);
        g.appendChild(hit);
        svg.appendChild(g);
    }

    function setupSVG(tab, width = 500, height = 500) {
        const svg = document.getElementById('svg-' + tab);
        svg.innerHTML = ''; 

        const centerX = width / 2;
        const centerY = height / 2;
        const offset = height * 0.15; 
        const lineWidth = width * 0.35; 

        const x1 = centerX - lineWidth / 2;
        const x2 = centerX + lineWidth / 2;
        const refY = centerY - offset; 
        const meaY = centerY + offset; 

        const configs = [
            { id: tab+'-l-ref', color: '#ffff00', x1: x1, y1: refY, x2: x2, y2: refY },
            { id: tab+'-l-mea', color: '#ff00ff', x1: x1, y1: meaY, x2: x2, y2: meaY }
        ];

        configs.forEach(c => {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("id", c.id);
            line.setAttribute("x1", c.x1); line.setAttribute("y1", c.y1);
            line.setAttribute("x2", c.x2); line.setAttribute("y2", c.y2);
            line.setAttribute("stroke", c.color);
            line.setAttribute("class", c.id.includes('ref') ? 'line-ref' : 'line-mea');
            svg.appendChild(line);
            createHandle(svg, c.id, 1, c.x1, c.y1, c.color);
            createHandle(svg, c.id, 2, c.x2, c.y2, c.color);
        });
    }

    function syncHandles(lineId) {
        const line = document.getElementById(lineId);
        const x1 = parseFloat(line.getAttribute('x1')), y1 = parseFloat(line.getAttribute('y1'));
        const x2 = parseFloat(line.getAttribute('x2')), y2 = parseFloat(line.getAttribute('y2'));
        const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
        document.getElementById(`${lineId}-g1`).setAttribute("transform", `translate(${x1},${y1}) rotate(${angle})`);
        document.getElementById(`${lineId}-g2`).setAttribute("transform", `translate(${x2},${y2}) rotate(${angle})`);
    }

    function initTouch() {
        const container = document.getElementById('container');

        container.addEventListener('pointerdown', e => {
            if (isEndpointDragging) return;
            evCache.push(e);
            if (evCache.length === 1) {
                panState.dragging = true;
                panState.lastX = e.clientX;
                panState.lastY = e.clientY;
            } else if (evCache.length === 2) {
                panState.dragging = false;
                prevDiff = Math.hypot(
                    evCache[0].clientX - evCache[1].clientX,
                    evCache[0].clientY - evCache[1].clientY
                );
            }
        });

        container.addEventListener('pointermove', e => {
            if (isEndpointDragging) return;
            const index = evCache.findIndex(item => item.pointerId === e.pointerId);
            if (index !== -1) evCache[index] = e;

            if (evCache.length === 2) {
                const curDiff = Math.hypot(
                    evCache[0].clientX - evCache[1].clientX,
                    evCache[0].clientY - evCache[1].clientY
                );
                if (prevDiff > 0) {
                    zoomAtRatio(curDiff / prevDiff);
                }
                prevDiff = curDiff;
                return;
            }

            if (evCache.length === 1 && panState.dragging) {
                const dx = e.clientX - panState.lastX;
                const dy = e.clientY - panState.lastY;
                panState.lastX = e.clientX; 
                panState.lastY = e.clientY;

                data[cur].panX = (data[cur].panX || 0) + dx;
                data[cur].panY = (data[cur].panY || 0) + dy;

                if (!panFrame) {
                    panFrame = requestAnimationFrame(() => {
                        panFrame = null;
                        apply();
                    });
                }
            }
        });

        const handlePointerEnd = e => {
            const index = evCache.findIndex(item => item.pointerId === e.pointerId);
            if (index !== -1) evCache.splice(index, 1);
            if (evCache.length < 2) prevDiff = -1;
            if (evCache.length === 0) panState.dragging = false;
        };

        container.addEventListener('pointerup', handlePointerEnd);
        container.addEventListener('pointercancel', handlePointerEnd);
        container.addEventListener('pointerout', handlePointerEnd);
        container.addEventListener('pointerleave', handlePointerEnd);

        container.addEventListener('wheel', e => {
            e.preventDefault();
            zoomAtRatio(e.deltaY < 0 ? 1.1 : 0.9);
        }, { passive: false });
    }

    function setZoomScale(scale) {
        const baseS = data[cur].baseS || 1;
        let minS = baseS * 0.2;
        let maxS = baseS * 3.0;
        let s = Math.min(Math.max(scale, minS), maxS);
        data[cur].s = s;
        apply();
    }

    function zoomAtRatio(ratio) {
        setZoomScale(data[cur].s * ratio);
    }

    function startHDrag(evt, lineId, idx, group) {
        evt.stopPropagation();
        const svg = group.ownerSVGElement, img = document.getElementById('img-'+cur);
        if(!img.src) return;

        isEndpointDragging = true;
        group.setPointerCapture(evt.pointerId);

        const strokeColor = document.getElementById(lineId).getAttribute("stroke") || '#ff00ff';

        mag.style.display = 'block';
        magContent.innerHTML = '';
        magContent.appendChild(img.cloneNode());

        if (magSvg) magSvg.remove();
        magSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        magSvg.setAttribute('width', '80');
        magSvg.setAttribute('height', '80');
        magSvg.style.position = 'absolute';
        magSvg.style.left = '0';
        magSvg.style.top = '0';
        mag.appendChild(magSvg);

        const center = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        center.setAttribute('cx', '40');
        center.setAttribute('cy', '40');
        center.setAttribute('r', '3');
        center.setAttribute('fill', 'red');
        magSvg.appendChild(center);

        magLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        magLine.setAttribute('stroke', strokeColor);
        magLine.setAttribute('stroke-width', '3');
        magLine.setAttribute('stroke-linecap', 'round');
        magSvg.appendChild(magLine);

        let dragEvent = null;
        let rafId = null;

        function updateMagnifierLine(line, p, zoom) {
            let ox = idx === 1 ? parseFloat(line.getAttribute('x2')) : parseFloat(line.getAttribute('x1'));
            let oy = idx === 1 ? parseFloat(line.getAttribute('y2')) : parseFloat(line.getAttribute('y1'));
            let dx = ox - p.x;
            let dy = oy - p.y;
            let lx = 40 + dx * zoom;
            let ly = 40 + dy * zoom;

            magLine.setAttribute('x1', '40');
            magLine.setAttribute('y1', '40');
            magLine.setAttribute('x2', lx);
            magLine.setAttribute('y2', ly);
        }

        group.onpointermove = e => {
            dragEvent = e;
            if (rafId) return;

            rafId = requestAnimationFrame(() => {
                rafId = null;
                if(!dragEvent) return;

                const e2 = dragEvent;
                const pt = svg.createSVGPoint();
                pt.x = e2.clientX;
                pt.y = e2.clientY;
                const p = pt.matrixTransform(svg.getScreenCTM().inverse());

                const line = document.getElementById(lineId);
                line.setAttribute(`x${idx}`, p.x);
                line.setAttribute(`y${idx}`, p.y);
                syncHandles(lineId);

                if (lineId.includes('mea')) {
                    if(idx===1) data[cur].moved1 = true;
                    if(idx===2) data[cur].moved2 = true;
                }

                mag.style.left = (e2.clientX - 40) + 'px';
                mag.style.top = (e2.clientY - 120) + 'px';

                const zoom = data[cur].s * 2.5;
                magContent.style.transform = `translate(${-p.x * zoom + 40}px, ${-p.y * zoom + 40}px) scale(${zoom})`;

                updateMagnifierLine(line, p, zoom);

                updateCalc();
                dragEvent = null;
            });
        };

        const stopHDrag = (e) => {
            group.onpointermove = null;
            group.onpointerup = null;
            group.onpointercancel = null;
            mag.style.display = 'none';
            if (magSvg) magSvg.remove();
            isEndpointDragging = false;
            try { group.releasePointerCapture(e.pointerId); } catch(err) {}
        };

        group.onpointerup = stopHDrag;
        group.onpointercancel = stopHDrag;
    }

    function apply() { 
        const vBox = document.getElementById('view-' + cur);
        const nw = data[cur].naturalW || 500;
        const nh = data[cur].naturalH || 500;
        const scaledW = nw * data[cur].s;
        const scaledH = nh * data[cur].s;

        vBox.style.width = scaledW + 'px';
        vBox.style.height = scaledH + 'px';

        document.getElementById('layer-'+cur).style.transform = `translate(${data[cur].panX||0}px,${data[cur].panY||0}px) scale(${data[cur].s})`; 
    }
    
    function switchTab(t) {
        cur = t;
        document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
        document.getElementById('tab-'+t).classList.add('active');
        document.querySelectorAll('.viewer-box').forEach(e => e.classList.remove('active'));
        document.getElementById('view-'+t).classList.add('active');
        setZoomScale(data[cur].s);
    }
    
    function triggerFile(event) { 
        if(event) event.stopPropagation();
        const targetInput = document.getElementById('inputAlbum');
        targetInput.value = '';
        targetInput.click(); 
    }
    
    function loadImg(el) {
        if(!el.files || !el.files[0]) return;
        const url = URL.createObjectURL(el.files[0]);
        const img = document.getElementById('img-' + cur);
        img.src = url;
        img.onload = () => {
            const w = img.naturalWidth;
            const h = img.naturalHeight;
            
            data[cur].naturalW = w;
            data[cur].naturalH = h;

            document.getElementById('svg-'+cur).setAttribute('viewBox', `0 0 ${w} ${h}`);
            setupSVG(cur, w, h);
            
            const containerW = document.getElementById('container').clientWidth || 500;
            const initScale = containerW / w;
            data[cur].baseS = initScale;
            data[cur].s = initScale;
            data[cur].panX = 0;
            data[cur].panY = 0;
            data[cur].moved1 = false; 
            data[cur].moved2 = false; 

            apply();
            updateCalc();
        };
    }

    function updateCalc() {
        const ref = parseFloat(document.getElementById('refD').value) || 16.0;
        ['ap', 'lat'].forEach(t => {
            const rL = document.getElementById(t+'-l-ref'), mL = document.getElementById(t+'-l-mea');
            if(!rL) return;
            const dR = Math.hypot(parseFloat(rL.getAttribute('x2'))-parseFloat(rL.getAttribute('x1')), parseFloat(rL.getAttribute('y2'))-parseFloat(rL.getAttribute('y1')));
            const dM = Math.hypot(parseFloat(mL.getAttribute('x2'))-parseFloat(mL.getAttribute('x1')), parseFloat(mL.getAttribute('y2'))-parseFloat(mL.getAttribute('y1')));
            data[t].dist = dR > 0 ? (dM / dR) * ref : 0;
        });

        const apReady = data.ap.moved1 && data.ap.moved2;
        const latReady = data.lat.moved1 && data.lat.moved2;
        
        const apVal = apReady ? data.ap.dist : 0;
        const latVal = latReady ? data.lat.dist : 0;
        const total = apVal + latVal;

        const tadTotalEl = document.getElementById('tadTotal');
        if (apReady || latReady) {
            tadTotalEl.innerText = total.toFixed(1) + " mm";
            tadTotalEl.style.color = (total >= 10 && total <= 25) ? "#00ff00" : "#ff4444";
        } else {
            tadTotalEl.innerText = "--";
            tadTotalEl.style.color = "white";
        }

        const updateTabDisplay = (id, val, ready) => {
            const el = document.getElementById(id);
            if (ready) {
                el.innerText = val.toFixed(1) + "mm";
                el.style.color = (val <= 4 || val > 20) ? "#ff4444" : "#00ff00";
            } else {
                el.innerText = "--";
                el.style.color = "#888";
            }
        };
        updateTabDisplay('apDisplay', data.ap.dist, apReady);
        updateTabDisplay('latDisplay', data.lat.dist, latReady);

        const dict = i18n[currentLang] || i18n['zh-CN'];
        const riskEl = document.getElementById('riskNotice');
        let riskMsg = "";
        if (apReady || latReady) {
            if (total > 25) {
                riskMsg = dict.riskCutOut;
            } else if ((apReady && latReady) && total < 10) {
                riskMsg = dict.riskCutThrough;
            } else if (apReady && data.ap.dist <= 4) {
                riskMsg = dict.riskApPenetration;
            } else if (latReady && data.lat.dist <= 4) {
                riskMsg = dict.riskLatPenetration;
            }
        }

        if (riskMsg) {
            riskEl.innerText = riskMsg;
            riskEl.style.display = "block";
        } else {
            riskEl.style.display = "none";
        }
    }

    setupSVG('ap', 500, 500); 
    setupSVG('lat', 500, 500); 
    initTouch();
    initLanguage();
</script>
</body>
</html>
