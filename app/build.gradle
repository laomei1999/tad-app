plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ortho.tad'
    compileSdk 34

    defaultConfig {
        applicationId "com.ortho.tad"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // 纯原生 Android SDK 编译，无需外部第三方库，彻底避免依赖解析失败
}
